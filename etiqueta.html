<!DOCTYPE html>
<html lang="pt-BR" data-versao="9">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etq. Transportadora — TB Comércio de Presentes</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0c0e14">

<!-- Montserrat desenha a etiqueta impressa; JetBrains Mono, os campos numéricos. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="etiqueta-style.css?v=9">
</head>
<body>
<script>
/* O GitHub Pages entrega o HTML com cache de 10 minutos, então logo depois de uma
   publicação o navegador ainda mostra a página antiga. Aqui a versão publicada é
   conferida a cada carregamento e, se for diferente da que abriu, a página é
   trocada por uma URL com a versão nova — recarregar puro não resolve, porque
   volta do mesmo cache. O ?v= na barra de endereço também é o freio: com ele
   presente não há nova troca, então não existe laço. */
(function(){
  var V = document.documentElement.getAttribute('data-versao');
  if (/[?&]v=/.test(location.search)) return;          // já viemos de uma troca
  try{
    fetch(location.pathname, { cache: 'reload' })
      .then(function(r){ return r.ok ? r.text() : null; })
      .then(function(t){
        if (!t) return;
        var m = t.match(/data-versao="([^"]+)"/);
        if (m && m[1] !== V) location.replace(location.pathname + '?v=' + m[1]);
      })
      .catch(function(){});
  }catch(e){}
})();
</script>

<!-- ============ VERIFICANDO SESSÃO ============ -->
<div id="authCheck"><div class="spinner"></div></div>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="4" width="14" height="17" rx="2" stroke="#fff" stroke-width="2"/><rect x="9" y="2" width="6" height="3.6" rx="1.2" fill="#fff"/><path d="M8.4 12.6l2.6 2.6 5-5.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div><h1>TB Comércio de Presentes<span>Expedição · S.A.</span></h1></div>
  </div>
  <h2>Entrar</h2>
  <form id="loginForm">
    <div class="field">
      <label for="loginEmail">E-mail</label>
      <input type="email" id="loginEmail" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="loginPassword">Senha</label>
      <input type="password" id="loginPassword" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary" type="submit" id="loginBtn">Entrar</button>
    <div id="loginError"></div>
  </form>
</div>

<!-- ============ APP (só aparece depois do login) ============ -->
<div id="appScreen">
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="4" width="14" height="17" rx="2" stroke="#fff" stroke-width="2"/><rect x="9" y="2" width="6" height="3.6" rx="1.2" fill="#fff"/><path d="M8.4 12.6l2.6 2.6 5-5.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><h1>TB Comércio de Presentes<span>Expedição · S.A.</span></h1></div>
    </div>
    <div class="topbar-right">
      <div class="nav-links">
        <a href="index.html">Protocolo</a>
        <a href="etiqueta.html" class="active">Etq. Transportadora</a>
        <a href="transferencia.html">Etq. Transferência</a>
      </div>
      <button id="logoutBtn" class="logout-btn" style="display:none;">Sair</button>
    </div>
  </div>

  <div class="duo">

    <!-- ============ FORMULÁRIO ============ -->
    <div class="card card--form">
      <div class="card-head">
        <div><h2>Etiqueta de transportadora</h2></div>
        <div class="save-indicator"><span class="dot2"></span>100 × 122 mm</div>
      </div>

      <form id="form-etiqueta" autocomplete="off" novalidate>
        <div class="field-row">
          <div class="field field--full" style="min-width:240px">
            <label for="nome">Nome do destinatário</label>
            <input type="text" id="nome" name="nome" data-required placeholder="Nome ou razão social">
          </div>
          <div class="field field--cep" style="max-width:126px;min-width:112px">
            <label for="cep">CEP</label>
            <input type="text" id="cep" name="cep" data-required inputmode="numeric"
                   maxlength="9" placeholder="00000-000" class="mono">
          </div>
          <div class="field field--numero" style="max-width:100px;min-width:88px">
            <label for="numero">Número</label>
            <input type="text" id="numero" name="numero" data-required class="mono" placeholder="270">
          </div>
        </div>

        <div class="field-row">
          <div class="field field--endereco" style="min-width:220px">
            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" name="endereco" data-required placeholder="Preenchido pelo CEP">
            <p class="hint" id="cep-status" role="status" aria-live="polite"></p>
          </div>
          <div class="field field--complemento" style="min-width:150px">
            <label for="complemento">Complemento <span class="opt">opcional</span></label>
            <input type="text" id="complemento" name="complemento" placeholder="Sala, bloco, apto">
          </div>
        </div>

        <div class="field-row">
          <div class="field field--bairro">
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" name="bairro" data-required placeholder="Preenchido pelo CEP">
          </div>
          <div class="field field--cidade">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" data-required placeholder="Preenchido pelo CEP">
          </div>
          <div class="field field--uf" style="max-width:88px;min-width:80px">
            <label for="uf">UF</label>
            <select id="uf" name="uf" data-required>
              <option value="">--</option>
              <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
              <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
              <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
              <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
              <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
              <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
              <option>SP</option><option>SE</option><option>TO</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field field--danfe">
            <label for="danfe">Chave de acesso da NF-e <span class="opt">44 dígitos</span></label>
            <input type="text" id="danfe" name="danfe" inputmode="numeric" maxlength="54"
                   class="mono" placeholder="Cole a chave aqui" autocomplete="off">
            <p class="hint" id="danfe-status" role="status" aria-live="polite"></p>
          </div>
        </div>

        <div class="field-row">
          <div class="field field--nf" style="max-width:118px;min-width:100px">
            <label for="nf">Nota fiscal</label>
            <input type="text" id="nf" name="nf" data-required inputmode="numeric" class="mono" placeholder="000000">
          </div>
          <div class="field field--serie" style="max-width:82px;min-width:74px">
            <label for="serie">Série</label>
            <input type="text" id="serie" name="serie" inputmode="numeric" maxlength="3" class="mono" placeholder="1">
          </div>
          <div class="field field--tipo" style="max-width:150px;min-width:140px">
            <span class="label-like">Tipo</span>
            <div class="segmented" role="radiogroup" aria-label="Tipo do pedido">
              <label class="segment"><input type="radio" name="tipo" value="TBS" checked><span>TBS</span></label>
              <label class="segment"><input type="radio" name="tipo" value="TRAN"><span>TRAN</span></label>
            </div>
          </div>
          <div class="field field--pedido" style="max-width:132px;min-width:118px">
            <label for="pedido">Pedido</label>
            <input type="text" id="pedido" name="pedido" data-required inputmode="numeric" class="mono" placeholder="0049974">
          </div>
          <div class="field" style="min-width:150px">
            <span class="label-like">Identificação</span>
            <output class="code-preview code-preview--so" id="codigo-preview" for="pedido">
              <strong id="codigo-valor">TBS-—</strong>
            </output>
          </div>
        </div>

        <div class="field-row">
          <div class="field field--transportadora">
            <label for="transportadora">Transportadora</label>
            <div class="autocomplete">
              <input type="text" id="transportadora" name="transportadora" data-required
                     placeholder="Digite para buscar" role="combobox"
                     aria-expanded="false" aria-autocomplete="list" aria-controls="sugestoes">
              <ul class="suggestions" id="sugestoes" role="listbox" hidden></ul>
            </div>
          </div>
          <div class="field field--volumes" style="max-width:170px">
            <label for="volumes">Volumes</label>
            <div class="stepper">
              <button type="button" class="stepper-btn" data-step="-1" aria-label="Diminuir volumes">−</button>
              <input type="number" id="volumes" name="volumes" value="1" min="1" max="999" class="mono">
              <button type="button" class="stepper-btn" data-step="1" aria-label="Aumentar volumes">+</button>
            </div>
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-primary" id="btn-gerar">Gerar etiquetas <kbd>F2</kbd></button>
          <button type="button" class="btn btn-ghost" id="btn-limpar">Limpar <kbd>Esc</kbd></button>
        </div>
      </form>
    </div>

    <!-- ============ ETIQUETAS GERADAS ============ -->
    <div class="card card--saida">
      <div class="card-head saida-head">
        <div><h2 id="contador">Nenhuma etiqueta</h2></div>
        <button type="button" class="btn btn-primary btn-print" id="btn-imprimir" disabled>
          Imprimir <kbd>F4</kbd>
        </button>
      </div>
      <p class="print-tip">Margens: nenhuma · sem cabeçalhos</p>

      <div class="labels" id="labels">
        <div class="empty" id="empty-state">
          <div class="empty-art" aria-hidden="true"><span></span><span></span><span></span></div>
          <p>Nenhuma etiqueta gerada</p>
        </div>
      </div>
    </div>

  </div><!-- /.duo -->


</div><!-- /.wrap -->
</div><!-- /#appScreen -->

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="firebase-config.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // A Etiqueta de Transportadora não usa Firestore: os dados ficam só neste computador.
  const app = initializeApp(window.FIREBASE_CONFIG);
  const auth = getAuth(app);

  const authCheck = document.getElementById('authCheck');
  const loginScreen = document.getElementById('loginScreen');
  const appScreen = document.getElementById('appScreen');
  const loginForm = document.getElementById('loginForm');
  const loginError = document.getElementById('loginError');
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');

  onAuthStateChanged(auth, (user)=>{
    authCheck.style.display = 'none';
    if(user){
      loginScreen.style.display = 'none';
      appScreen.style.display = 'block';
      logoutBtn.style.display = 'inline-block';
    } else {
      loginScreen.style.display = 'block';
      appScreen.style.display = 'none';
      logoutBtn.style.display = 'none';
    }
  });

  loginForm.addEventListener('submit', (e)=>{
    e.preventDefault();
    loginError.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Entrando...';
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    signInWithEmailAndPassword(auth, email, password)
      .catch((err)=>{
        loginError.textContent = 'E-mail ou senha inválidos.';
        console.error(err);
      })
      .finally(()=>{
        loginBtn.disabled = false;
        loginBtn.textContent = 'Entrar';
      });
  });

  logoutBtn.addEventListener('click', ()=> signOut(auth));
</script>

<script src="etiqueta-script.js?v=9"></script>
</body>
</html>
